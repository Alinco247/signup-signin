<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>sign up</title>
</head>

<body>
    <main>
        <div class="form-container" id="form-box">
            <h1>Create Account</h1>
            <p class="subtitle">join us today by filling out your info</p>
            <form action="">
                <div class="input-group">
                    <label for="Firstname">Fullname</label>
                    <input type="text" name="signup-firstname" id="Firstname">
                    <div>
                    </div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" name="email" id="email">
                </div>
                <div class="input-group">
                    <label for="password">password</label>
                    <input type="password" name="signup-password" id="password">
                </div>
                <button type="submit" class="signup-btn">sign up</button>
            </form>
            <p class="switch-text">Already have an Account?
                <a href="./signin.html" class="switch-link">sign in</a>
            </p>
        </div>
    </main>
</body>

</html>
